[package]
name = "official-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "official-server"
path = "server.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
anyhow = "1"
