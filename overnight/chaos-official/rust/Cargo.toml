[package]
name = "chaos-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chaos-server"
path = "server.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
